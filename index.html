<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>يلا نحفظ قرآن</title>
    <link rel="icon" type="image/x-icon" href="watermarkd0a33818d9cd85df0dcea6b3c0d7a37b(1).jpg" />
    <style>
      :root {
        --bg: #f3f0e8;
        --card: rgba(255, 255, 255, 0.8);
        --primary: #1d4d3b;
        --secondary: #c9994a;
        --text: #1a1a1a;
        --muted: #5f5a52;
        --shadow: 0 20px 45px rgba(30, 62, 52, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f8f3e9 0%, #efe8d8 100%);
        color: var(--text);
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        background-image: linear-gradient(rgba(243, 240, 232, 0.95), rgba(243, 240, 232, 0.9)),
          url("watermarkd0a33818d9cd85df0dcea6b3c0d7a37b.jpg");
        background-size: cover;
        background-position: center;
      }

      .card {
        width: min(760px, 100%);
        background: var(--card);
        border: 1px solid rgba(29, 77, 59, 0.08);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 40px 32px;
        backdrop-filter: blur(8px);
      }

      .badge {
        display: inline-block;
        background: rgba(201, 153, 74, 0.15);
        color: var(--primary);
        border: 1px solid rgba(201, 153, 74, 0.25);
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.3;
        color: var(--primary);
      }

      h2 {
        margin: 0 0 24px;
        color: var(--secondary);
        font-size: clamp(1.4rem, 3vw, 2rem);
      }

      .subtext {
        color: var(--muted);
        font-size: 1.1rem;
        line-height: 1.8;
        margin-bottom: 28px;
      }

      .cta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-bottom: 28px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0 22px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn.primary {
        background: var(--primary);
        color: white;
        box-shadow: 0 14px 30px rgba(29, 77, 59, 0.2);
      }

      .btn.secondary {
        background: rgba(29, 77, 59, 0.08);
        color: var(--primary);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(120px, 1fr));
        gap: 14px;
      }

      .stat {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(29, 77, 59, 0.08);
        border-radius: 18px;
        padding: 18px 14px;
        text-align: center;
      }

      .stat strong {
        display: block;
        font-size: 1.8rem;
        color: var(--primary);
        margin-bottom: 6px;
      }

      .stat span {
        color: var(--muted);
        font-size: 0.9rem;
      }

      @media (max-width: 560px) {
        .card {
          padding: 28px 20px;
        }

        .stats {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card">
        <div class="badge">مبادرة يومية</div>
        <h1>احفظ جزءين قرآن اليوم</h1>
        <h2>لا تلتفت للوساوس</h2>

        <p class="subtext">
          ابدأ اليوم بثبات، وركز على هدفك في حفظ كتاب الله، فكل يوم يضيف لك خطوة جديدة نحو
          التمكين والطمأنينة.
        </p>

        <div class="cta-row">
          <a class="btn primary" href="#">ابدأ اليوم</a>
          <a class="btn secondary" href="#">مراجعة</a>
        </div>

        <div class="stats" aria-label="إحصائيات الحفظ">
          <div class="stat">
            <strong>2</strong>
            <span>أجزاء</span>
          </div>
          <div class="stat">
            <strong>15</strong>
            <span>دقيقة</span>
          </div>
          <div class="stat">
            <strong>1</strong>
            <span>هدف</span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
